# XR-1 RoboCasa formal STEAM critic template.
#
# For a real multi-leaf workspace, regenerate this file with:
#   python tools/generate_xr1_steam_configs.py \
#     --data-root "$RUN_ROOT" \
#     --run-root "$RUN_ROOT" \
#     --config-dir examples/offline_rl/config \
#     --success-only --num-bins 32 \
#     --length-scale-enabled --length-scale-percentile 90 \
#     --ensemble-size 3 \
#     --micro-batch-size 8 --global-batch-size 64 \
#     --value-max-steps 16000
#
# This committed template intentionally contains one env-selected success leaf;
# the generator is the source of truth for enumerating all real dataset leaves.
defaults:
  - model/steam_value_model@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/offline_rl/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: sft
  logger:
    log_path: ${oc.env:RUN_ROOT}/steam_value_training
    project_name: rlinf
    experiment_name: steam_xr1_robocasa_value
    logger_backends: [tensorboard]
  max_epochs: -1
  max_steps: 16000
  val_check_interval: -1
  save_interval: 1000

data:
  train_data_paths:
    - dataset_path: ${oc.env:XR1_SUCCESS_DATASET}
      type: sft
      only_success: true
      weight: 1.0
  balance_weights: true
  seed: 42
  dataset_type: sft
  camera_keys:
    - observation.images.robot0_agentview_left
    - observation.images.robot0_eye_in_hand
  k: 32
  only_success: true
  length_scale_enabled: true
  length_scale_percentile: 90
  min_episode_length: null
  train_num_workers: 0
  eval_num_workers: 0
  prefetch_factor: null
  persistent_workers: false
  pin_memory: false
  do_augment: false

algorithm:
  adv_type: gae

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 8
  global_batch_size: 64
  seed: 0

  model:
    precision: fp32
    fusion_hidden_dim: 512
    dropout: 0.1
    label_smoothing: 0.05
    num_frames_per_pair: 2
    num_bins: 32
    vision_repo_id: ${oc.env:STEAM_VISION_MODEL}
    language_repo_id: ${oc.env:STEAM_LANGUAGE_MODEL}
    tokenizer_path: ${oc.env:STEAM_LANGUAGE_MODEL}
    freeze_vision_encoder: false
    freeze_language_model: false
    max_state_dim: 32
    state_discretization_bins: 256
    max_token_len: 200
    ensemble_size: 3
    ensemble_head_seed_base: 0
    use_gradient_checkpointing: true

  optim:
    lr: 5.0e-5
    value_lr: 5.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-5
    clip_grad: 10.0
    lr_scheduler: constant
    lr_warmup_steps: 500
    total_training_steps: 16000
    min_lr: 1.0e-6

  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    use_orig_params: true
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32

reward:
  use_reward_model: false
critic:
  use_critic_model: false
