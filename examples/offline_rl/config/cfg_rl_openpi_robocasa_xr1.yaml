algorithm:
  adv_type: gae

actor:
  group_name: "ActorGroup"
  training_backend: fsdp
  micro_batch_size: 1
  global_batch_size: 8
  seed: 0

  model:
    precision: null
    model_path: "/path/to/pi05-robocasa-human300-pytorch"
    model_type: cfg_model
    add_value_head: false
    num_action_chunks: 5
    action_dim: 12
    openpi:
      config_name: pi05_robocasa365_pretrain_human300
      num_images_in_input: 2
      action_chunk: ${actor.model.num_action_chunks}
      action_env_dim: ${actor.model.action_dim}
      num_steps: 5
      train_expert_only: false
      guidance_type: positive
      unconditional_prob: 0.1
      positive_only_conditional: true
    openpi_data:
      norm_stats_path: /path/to/steam_xr1_v30_copy/robocasa_norm_stats
      state_space: 16d
      image_space: 2views
      action_space: 12d

  optim:
    lr: 1.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-10
    clip_grad: 1.0
    lr_scheduler: cosine
    lr_warmup_steps: 5000
    total_training_steps: 30000
    min_lr: 0.0

  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    use_orig_params: false
    gradient_checkpointing: true
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: false
critic:
  use_critic_model: false
