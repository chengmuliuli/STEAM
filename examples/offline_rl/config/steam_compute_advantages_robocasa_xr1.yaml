# XR-1 RoboCasa formal STEAM advantage-labeling template.
# Regenerate with tools/generate_xr1_steam_configs.py for all rollout leaves.
advantage:
  value_checkpoint: ${oc.env:STEAM_VALUE_CHECKPOINT}
  batch_size: 8
  num_dataloader_workers_per_gpu: 0
  prefetch_factor: 2
  label_mode: quantile
  rollout_quantile: 0.3
  tag: steam_xr1_succ_b32_k32_ls90_e3
  model:
    precision: bf16

data:
  k: 32
  length_scale_enabled: true
  length_scale_percentile: 90
  camera_keys:
    - observation.images.robot0_agentview_left
    - observation.images.robot0_eye_in_hand
  train_data_paths:
    - dataset_path: ${oc.env:XR1_ROLLOUT_DATASET}
      type: rollout
      weight: 1.0

distributed:
  backend: nccl
  timeout: 3600
